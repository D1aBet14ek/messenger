# =====================================================================
#  Nixpacks — «сборщик» для Dokploy.
#
#  Что делает Nixpacks автоматически:
#    * видит requirements.txt и сам ставит Python;
#    * устанавливает все библиотеки из requirements.txt
#      (Flask, SQLAlchemy, gunicorn и остальные);
#    * собирает образ для запуска.
#
#  От нас нужна только команда запуска — она ниже.
# =====================================================================

[start]
# Запускаем мессенджер «боевым» сервером gunicorn (не учебным app.run).
# Порт берём из переменной PORT (её задаёт Dokploy), а если её нет — 8000.
# Работаем в 2 «работника», чтобы страницы открывались быстрее.
cmd = "gunicorn app:app --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 60"
