# =====================================================================
#  Nixpacks — «сборщик» для Dokploy.
#
#  Nixpacks сам видит requirements.txt, ставит Python и все библиотеки,
#  собирает образ. От нас — только команда запуска ниже.
# =====================================================================

[start]
# Мессенджер запускается «боевым» сервером gunicorn и слушает порт 8000.
# ВАЖНО: в Dokploy у домена (вкладка Domains) тоже должен стоять порт 8000.
# Логи пишем на экран (--access-logfile -), тогда их видно в Dokploy → Logs.
cmd = "gunicorn app:app --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile - --error-logfile -"
