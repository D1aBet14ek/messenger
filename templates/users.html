{% extends "base.html" %}
{% block title %}Контакты — Поговорим{% endblock %}

{% block content %}
<h1>Добавить в друзья</h1>

<form method="post" action="{{ url_for('friends_add') }}" class="card" autocomplete="off">
  <label>Логин человека (@имя)
    <input name="who" required maxlength="20" placeholder="@anna_2026" autofocus>
    <span class="hint">Человек получит заявку и подтвердит её — тогда вы появитесь
      друг у друга в контактах и сможете общаться.</span>
  </label>
  <button class="btn" type="submit">Отправить заявку</button>
</form>

{#
  Список контактов, заявок и групп — в отдельной рамке (iframe).
  Внутри неё стоит <meta refresh>, поэтому обновляется только она,
  а вся страница не мигает. Без JavaScript.
#}
<iframe class="list-frame"
        src="{{ url_for('chats_frame') }}"
        title="Контакты, заявки и группы"></iframe>
{% endblock %}
