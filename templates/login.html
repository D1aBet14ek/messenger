{% extends "base.html" %}
{% block title %}Вход — Поговорим{% endblock %}

{% block content %}
<h1>С возвращением 👋</h1>
<p class="muted">Введи номер телефона и пароль, чтобы войти.</p>

<form method="post" class="card">
  <label>Номер телефона
    <input name="phone" required maxlength="20" placeholder="+7 900 123-45-67" autocomplete="tel">
  </label>

  <label>Пароль
    <input name="password" type="password" required autocomplete="current-password">
  </label>

  <button class="btn" type="submit">Войти</button>
  <p class="muted">Ещё нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
</form>
{% endblock %}
